name: Build Windows ia32 (32-bit)

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-win-ia32:
        runs-on: windows-2022

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4

            -   name: Setup Bun
                uses: oven-sh/setup-bun@v2
                with:
                    bun-version: 1.3.14

            -   name: Cache dependencies
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.bun/install/cache
                        node_modules
                    key: bun-${{ runner.os }}-ia32-1.3.14-${{ hashFiles('bun.lock') }}

            -   name: Install dependencies
                run: bun install

            # bun installs only the optional native packages for the host (win32-x64).
            # usb v3 loads its binding from a per-platform package, so the win32-ia32
            # binding must be fetched explicitly and copied into node_modules.
            -   name: Fetch win32-ia32 binding for usb
                shell: pwsh
                run: |
                    New-Item -ItemType Directory -Force -Path ia32-native | Out-Null
                    Set-Location ia32-native
                    npm init -y | Out-Null
                    npm install --no-save --cpu=ia32 --os=win32 usb@3.2.1
                    Set-Location ..
                    $src = (Resolve-Path 'ia32-native/node_modules').Path
                    Get-ChildItem $src -Recurse -Directory -Depth 1 |
                        Where-Object { $_.Name -like '*win32-ia32*' } |
                        ForEach-Object {
                            $rel = $_.FullName.Substring($src.Length + 1)
                            $dest = Join-Path 'node_modules' $rel
                            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
                            Copy-Item -Recurse -Force $_.FullName $dest
                            Write-Host "Copied $rel"
                        }
                    $found = Get-ChildItem 'node_modules' -Recurse -Directory -Depth 1 |
                        Where-Object { $_.Name -like '*win32-ia32*' }
                    if (-not $found) { throw 'No win32-ia32 usb binding was copied into node_modules' }

            -   name: Typecheck
                run: bun run typecheck

            # electron-builder cannot rebuild natives under Bun (it calls `bun rebuild`),
            # so node-hid is rebuilt here against the Electron 22 ia32 headers.
            -   name: Rebuild native modules for ia32 Electron
                run: bun run rebuild:native

            # The target arch is set in package.json (win.target[].arch = "ia32").
            # electron-builder downloads the win32-ia32 Electron runtime and
            # packages the already-rebuilt native modules.
            -   name: Build ia32 installer and portable exe
                run: bun run package -- --publish never

            # Fail fast if the output is not really 32-bit.
            # PE header Machine field: 0x014C = x86 (32-bit), 0x8664 = x64.
            -   name: Verify 32-bit PE output
                shell: pwsh
                run: |
                    $app = Get-ChildItem -Path dist -Recurse -Filter '*.exe' |
                        Where-Object { $_.FullName -match 'ia32' -and $_.FullName -notmatch 'uninstall' } |
                        Select-Object -First 1
                    if (-not $app) { throw 'No ia32 .exe found under dist/' }
                    $bytes = [System.IO.File]::ReadAllBytes($app.FullName)
                    $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
                    $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
                    $hex = '{0:X4}' -f $machine
                    Write-Host "$($app.FullName) -> PE machine 0x$hex"
                    if ($machine -ne 0x014C) { throw "Expected 32-bit x86 (0x014C), got 0x$hex" }

            -   name: Upload artifacts
                uses: actions/upload-artifact@v4
                with:
                    name: attack-shark-x11-win-ia32
                    path: |
                        dist/*.exe
                        dist/*.blockmap
                        dist/latest.yml
                    if-no-files-found: error
                    retention-days: 14

            # Runs only after all previous steps succeeded.
            # Tag builds (v*) publish a normal release marked as "latest".
            # Manual or branch builds publish a prerelease named after the run,
            # so they never replace the stable release used by auto-update.
            -   name: Publish GitHub Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('ia32-build-{0}', github.run_number) }}
                    name: ${{ github.ref_type == 'tag' && github.ref_name || format('ia32 build {0}', github.run_number) }}
                    body: Automatic ia32 build from commit ${{ github.sha }}.
                    files: |
                        dist/*.exe
                        dist/*.blockmap
                        dist/latest.yml
                    prerelease: ${{ github.ref_type != 'tag' }}
                    make_latest: ${{ github.ref_type == 'tag' }}
                    fail_on_unmatched_files: true
