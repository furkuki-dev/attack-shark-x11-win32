name: Build Windows ia32 (32-bit)

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-win-ia32:
        runs-on: windows-2022

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Setup Bun
                uses: oven-sh/setup-bun@v2
                with:
                    bun-version: 1.3.14

            -   name: Cache dependencies
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.bun/install/cache
                        node_modules
                    key: bun-${{ runner.os }}-ia32-1.3.14-${{ hashFiles('bun.lock') }}

            -   name: Install dependencies
                run: bun install

            # i686-win7-windows-msvc was removed from current stable Rust, so pin the last
            # toolchain series that still ships it.
            -   name: Setup Rust (Windows 7 ia32 target)
                uses: dtolnay/rust-toolchain@1.77.2
                with:
                    targets: i686-win7-windows-msvc

            -   name: Cache Rust build
                uses: Swatinem/rust-cache@v2
                with:
                    workspaces: native-usb

            # The official usb v3 binding is built for i686-pc-windows-msvc, which needs
            # Windows 10. Build it for the Windows 7 target and put it where the usb
            # loader looks first (node_modules/usb/usb.win32-ia32-msvc.node).
            -   name: Build usb native binding for Windows 7 (ia32)
                shell: pwsh
                working-directory: native-usb
                run: |
                    cargo build --release --target i686-win7-windows-msvc --lib
                    if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
                    $dll = 'target/i686-win7-windows-msvc/release/usb.dll'
                    if (-not (Test-Path $dll)) { throw "Missing $dll" }
                    if (-not (Test-Path '../node_modules/usb')) { throw 'node_modules/usb is missing' }
                    Copy-Item $dll '../node_modules/usb/usb.win32-ia32-msvc.node' -Force
                    $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path '../node_modules/usb/usb.win32-ia32-msvc.node'))
                    $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
                    $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
                    Write-Host ('usb binding PE machine: 0x{0:X4}' -f $machine)
                    if ($machine -ne 0x014C) { throw 'usb binding is not 32-bit x86' }

            -   name: Typecheck
                run: bun run typecheck

            # electron-builder cannot rebuild natives under Bun (it calls `bun rebuild`),
            # so node-hid is rebuilt here against the Electron 22 ia32 headers.
            -   name: Rebuild native modules for ia32 Electron
                run: bun run rebuild:native

            # The target arch is set in package.json (win.target[].arch = "ia32").
            # electron-builder downloads the win32-ia32 Electron runtime and
            # rebuilds native modules (usb, node-hid) for ia32 automatically.
            -   name: Build ia32 installer and portable exe
                run: bun run package -- --publish never

            # Fail fast if the output is not really 32-bit.
            # PE header Machine field: 0x014C = x86 (32-bit), 0x8664 = x64.
            -   name: Verify 32-bit PE output
                shell: pwsh
                run: |
                    $app = Get-ChildItem -Path dist -Recurse -Filter '*.exe' |
                        Where-Object { $_.FullName -match 'ia32' -and $_.FullName -notmatch 'uninstall' } |
                        Select-Object -First 1
                    if (-not $app) { throw 'No ia32 .exe found under dist/' }
                    $bytes = [System.IO.File]::ReadAllBytes($app.FullName)
                    $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
                    $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
                    $hex = '{0:X4}' -f $machine
                    Write-Host "$($app.FullName) -> PE machine 0x$hex"
                    if ($machine -ne 0x014C) { throw "Expected 32-bit x86 (0x014C), got 0x$hex" }

            -   name: Upload artifacts
                uses: actions/upload-artifact@v4
                with:
                    name: attack-shark-x11-win-ia32
                    path: |
                        dist/*.exe
                        dist/*.blockmap
                        dist/latest.yml
                    if-no-files-found: error
                    retention-days: 14

            # Builds the release description: version, build facts, changes since the
            # previous tag, and SHA-256 checksums of the real files that were produced.
            -   name: Generate release notes
                shell: pwsh
                env:
                    REF_TYPE: ${{ github.ref_type }}
                    REF_NAME: ${{ github.ref_name }}
                    COMMIT_SHA: ${{ github.sha }}
                    RUN_NUMBER: ${{ github.run_number }}
                run: |
                    $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { "ia32-build-$env:RUN_NUMBER" }
                    $short = $env:COMMIT_SHA.Substring(0, 7)

                    # Commits since the previous tag (tag builds compare against the tag before this one)
                    if ($env:REF_TYPE -eq 'tag') {
                        $base = git describe --tags --abbrev=0 HEAD^ 2>$null
                    } else {
                        $base = git describe --tags --abbrev=0 2>$null
                    }
                    if ($base) {
                        $log = git log "$base..HEAD" --pretty=format:'%s (%h)'
                    } else {
                        $log = git log -n 20 --pretty=format:'%s (%h)'
                    }
                    $changes = @()
                    foreach ($line in $log) { if ($line -and $line.Trim()) { $changes += ('- ' + $line) } }
                    if ($changes.Count -eq 0) { $changes = @('- Без новых коммитов') }

                    # Checksums of the real build outputs
                    $rows = @()
                    foreach ($f in Get-ChildItem dist -Filter '*.exe') {
                        $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
                        $kind = if ($f.Name -match 'setup') { 'Установщик' } else { 'Portable' }
                        $rows += ('| ' + $kind + ' | `' + $f.Name + '` | `' + $hash + '` |')
                    }
                    if ($rows.Count -eq 0) { throw 'No .exe files in dist/ for the release notes' }

                    $pkg = Get-Content package.json -Raw | ConvertFrom-Json
                    $electron = $pkg.devDependencies.electron.TrimStart('^')
                    $usb = $pkg.dependencies.usb
                    $built = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm') + ' UTC'

                    $md = New-Object System.Collections.Generic.List[string]
                    $md.Add('## Attack Shark X11 Driver: сборка для 32-битной Windows')
                    $md.Add('')
                    $md.Add('Версия для 32-битных систем, включая Windows 7 SP1. Собрана автоматически из коммита `' + $short + '`.')
                    $md.Add('')
                    $md.Add('| | |')
                    $md.Add('|---|---|')
                    $md.Add('| **Версия** | `' + $version + '` |')
                    $md.Add('| **Коммит** | `' + $short + '` |')
                    $md.Add('| **Собрано** | ' + $built + ' |')
                    $md.Add('| **Архитектура** | x86 (ia32) |')
                    $md.Add('| **Electron** | ' + $electron + ' |')
                    $md.Add('| **usb (нативный модуль)** | ' + $usb + ' |')
                    $md.Add('')
                    $md.Add('### Что скачать')
                    $md.Add('- **Установщик** (`*-setup.exe`): установка с ярлыками и автообновлением.')
                    $md.Add('- **Portable** (`*-portable.exe`): запуск без установки.')
                    $md.Add('')
                    $md.Add('### Изменения')
                    $md.AddRange([string[]]$changes)
                    $md.Add('')
                    $md.Add('### Контрольные суммы SHA-256')
                    $md.Add('| Тип | Файл | SHA-256 |')
                    $md.Add('|---|---|---|')
                    $md.AddRange([string[]]$rows)
                    $md.Add('')
                    $md.Add('---')
                    $md.Add('Проверить файл: `Get-FileHash <файл> -Algorithm SHA256` в PowerShell.')

                    [System.IO.File]::WriteAllText(
                        (Join-Path (Get-Location) 'release-notes.md'),
                        ($md -join "`n"),
                        (New-Object System.Text.UTF8Encoding($false)))
                    Write-Host "Release notes written: $($md.Count) lines"

            # Runs only after all previous steps succeeded.
            # Tag builds (v*) publish a normal release marked as "latest".
            # Manual or branch builds publish a prerelease named after the run,
            # so they never replace the stable release used by auto-update.
            -   name: Publish GitHub Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('ia32-build-{0}', github.run_number) }}
                    name: ${{ github.ref_type == 'tag' && github.ref_name || format('ia32 build {0}', github.run_number) }}
                    body_path: release-notes.md
                    files: |
                        dist/*.exe
                        dist/*.blockmap
                        dist/latest.yml
                    prerelease: ${{ github.ref_type != 'tag' }}
                    make_latest: ${{ github.ref_type == 'tag' }}
                    fail_on_unmatched_files: true
